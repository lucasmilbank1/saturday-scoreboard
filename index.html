<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saturday Scoreboard</title>
<!-- styles.css owns body layout (flex-centred, .page is the centring child).
     Anything below must stay additive - do not re-declare body padding/display. -->
<link rel="stylesheet" href="styles.css">
<style>
  :root{color-scheme:light}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]:not([hidden=until-found i]){display:none!important}
  .load-msg{padding:40px 20px;font:14px ui-monospace,monospace;color:var(--ink-soft,#6b6a66)}
  .tier-badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line,#ddd)}
  .tier-badge.lean{opacity:.65}
  .slicer-checks{display:flex;flex-wrap:wrap;gap:10px 18px}
  .slicer-item{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .changelog{margin:0;padding-left:18px}
  .changelog li{margin-bottom:10px}
  .wbar-track{display:block;width:100%;min-width:60px;height:8px;border-radius:99px;background:var(--line,#e5e3dc)}
  .wbar{display:block;height:8px;border-radius:99px;background:var(--ink-soft,#8a8a86)}
  .breakdown td,.breakdown th{vertical-align:top}
  .breakdown td{padding-right:10px}
</style>
</head>
<body>
<div class="page">

<header>
  <div>
    <p class="eyebrow">College Football</p>
    <h1 id="pageTitle">Saturday Scoreboard</h1>
    <p class="week-line" id="subtitle">Picks, results and profitability by week</p>
  </div>
</header>

<nav class="tabs" id="main-tabs" role="tablist"></nav>

<div id="panels">
  <p class="load-msg" id="load-msg">Loading card&hellip;</p>
</div>

<!-- Profitability panel skeleton: populated by app.js -->
<template id="tpl-profitability">
  <section class="tab-panel" id="tab-profitability" role="tabpanel" hidden>
    <div class="slicer">
      <p class="slicer-label">Weeks included: <span id="slicer-summary-text">All weeks</span></p>
      <div class="slicer-checks" id="slicer-checks"></div>
    </div>

    <dl class="pnl-summary" id="pnl-summary"></dl>

    <div class="card">
      <h3>Profit / loss by ticket</h3>
      <svg id="chart-tickets" viewBox="0 0 680 400" role="img" aria-label="Profit and loss per ticket"></svg>
      <p class="caption" id="chart1-caption"></p>
    </div>

    <div class="card">
      <h3>Risked vs returned</h3>
      <svg id="chart-risked" viewBox="0 0 680 190" role="img" aria-label="Total risked versus total returned"></svg>
    </div>

    <div class="card">
      <h3>Week by week</h3>
      <table class="breakdown">
        <thead>
          <tr><th scope="col">Week</th><th scope="col" class="num">Bets</th><th scope="col" class="num">Risked</th><th scope="col" class="num">Returned</th><th scope="col" class="num">Net</th><th scope="col" class="num">Record</th></tr>
        </thead>
        <tbody id="week-breakdown"></tbody>
      </table>
    </div>
  </section>
</template>

<!-- Model panel skeleton: sections filled by app.js from feed.model -->
<template id="tpl-model">
  <section class="tab-panel" id="tab-model" role="tabpanel" hidden>
    <div class="section-title">
      <span class="eyebrow" id="model-eyebrow"></span>
      <h2>How Picks Get Made</h2>
      <p id="model-intro">The picks come from three layers stacked together: a team-rating engine that
        finds a point edge against the market, a checklist whose weights track how often each factor
        decided a game, and a risk score that turns those flags into a stake size.</p>
    </div>

    <section class="tm-callout">
      <h2>Read this first: what the model can and cannot do</h2>
      <p id="model-verdict"></p>
    </section>

    <dl class="pnl-summary" id="model-headline"></dl>

    <div class="card">
      <h3>Layer 1 &middot; Team-rating engine</h3>
      <p class="caption">Each step feeds the next. The output is how many points the model thinks a
        side is worth versus the posted line. Settings shown are the ones actually in force.</p>
      <table class="breakdown"><thead><tr>
        <th scope="col">Step</th><th scope="col">What happens</th><th scope="col">Setting</th>
      </tr></thead><tbody id="model-layer1"></tbody></table>
    </div>

    <div class="card">
      <h3>Layer 2 &middot; The checklist</h3>
      <p class="caption" id="model-checklist-note"></p>
      <table class="breakdown"><thead><tr>
        <th scope="col">#</th><th scope="col">Factor</th><th scope="col" class="num">Weight</th>
        <th scope="col">Relative</th><th scope="col" class="num">Decisive</th><th scope="col">Status</th>
      </tr></thead><tbody id="model-checklist"></tbody></table>
      <p class="caption" id="model-checklist-foot"></p>
    </div>

    <div class="card">
      <h3>Layer 3 &middot; Risk to stake</h3>
      <p class="caption">Add the weights of every item that comes back with a written caution against
        the pick. Clean items add nothing, whatever their own weight.</p>
      <table class="breakdown"><thead><tr>
        <th scope="col">Risk score</th><th scope="col">Action</th><th scope="col">Stake</th>
        <th scope="col">Meaning</th>
      </tr></thead><tbody id="model-stake"></tbody></table>
    </div>

    <div class="card">
      <h3>Version history</h3>
      <div id="model-changelog"></div>
    </div>

    <div class="card">
      <h3>Recent gate decisions</h3>
      <p class="caption">Every Saturday the quant gate searches for a better parameter set. It ships one
        only if it clears the ROI floor <em>and</em> holds up on a week the search never saw.
        <b>HOLD is the normal outcome.</b></p>
      <table class="breakdown"><thead><tr>
        <th scope="col">Date</th><th scope="col">Verdict</th><th scope="col">Detail</th>
      </tr></thead><tbody id="model-gate"></tbody></table>
    </div>

    <p class="caption" id="model-generated"></p>
  </section>
</template>

</div><!-- /.page -->
<script src="app.js"></script>
</body>
</html>
